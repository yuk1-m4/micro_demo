# PR のコミットメッセージと説明文に、Claude へのリンクがないか検査する（ADR 0007）。
name: no-session-links

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: コミットメッセージを検査する
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%h %s' -E \
            --grep='claude\.ai/' --grep='claude\.com/' --grep='^Claude-Session:' \
            "$BASE..$HEAD")
          if [ -n "$bad" ]; then
            echo "::error::コミットメッセージに Claude へのリンクがあります"
            echo "$bad"
            exit 1
          fi

      - name: PR のタイトルと説明文を検査する
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qE 'claude\.ai/|claude\.com/|Claude-Session:'; then
            echo "::error::PR のタイトルか説明文に Claude へのリンクがあります"
            exit 1
          fi
